name: Update Premier League Data

on:
  schedule:
    # Run every Sunday at 11 PM GMT (23:00 UTC)
    - cron: '0 23 * * 0'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: scorigami-repo-writes   # shared with the Scorigami bot, so the two never race
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        run: |
          install.packages(c('dplyr', 'readr', 'lubridate', 'shiny', 'rsconnect', 'httr2', 'jsonlite'), repos = 'https://cloud.r-project.org')
        shell: Rscript {0}

      - name: Run data update script
        run: |
          cd scorigami
          Rscript update_data.R

      - name: Check for changes
        id: verify_diff
        run: |
          cd scorigami
          git diff --quiet pl_history.rds || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          cd scorigami
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add pl_history.rds pl_history.csv bot/live_results.csv
          git commit -m "🤖 Auto-update: Premier League data ($(date +'%Y-%m-%d'))"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to shinyapps.io
        if: steps.verify_diff.outputs.changed == 'true'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          cd scorigami
          # The live results feed reads its token from .Renviron (deployed with the app, never committed)
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then printf 'FOOTBALL_DATA_TOKEN=%s\n' "$FOOTBALL_DATA_TOKEN" > .Renviron; fi
          Rscript -e "
            library(rsconnect)

            # Configure shinyapps.io account
            rsconnect::setAccountInfo(
              name   = '${{ secrets.SHINYAPPS_ACCOUNT }}',
              token  = '${{ secrets.SHINYAPPS_TOKEN }}',
              secret = '${{ secrets.SHINYAPPS_SECRET }}'
            )

            # Deploy the app
            # Upload only what the app needs (no backups or docs)
            rsconnect::deployApp(
              appFiles = c('app.R', 'pl_history.rds', 'bot/teams.csv', list.files('www', full.names = TRUE),
                           if (file.exists('.Renviron')) '.Renviron'),
              appName = 'premier-league-scorigami',
              account = '${{ secrets.SHINYAPPS_ACCOUNT }}',
              forceUpdate = TRUE,
              launch.browser = FALSE
            )

            cat('\n✅ Deployed to shinyapps.io\n')
          "

      - name: Summary
        run: |
          echo "## 📊 Data Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify_diff.outputs.changed }}" == "true" ]; then
            echo "- **Changes:** New data added and deployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Changes:** No new matches found" >> $GITHUB_STEP_SUMMARY
          fi
